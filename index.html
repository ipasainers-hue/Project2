<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Lock System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:#0f1117;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    position:relative;
}

/* Background Gear Animation */
.gear{
    position:absolute;
    border:4px solid rgba(255,255,255,0.05);
    border-radius:50%;
    animation:spin linear infinite;
}

.gear::before{
    content:'';
    position:absolute;
    inset:-10px;
    border:2px dashed rgba(255,255,255,0.08);
    border-radius:50%;
}

.gear1{
    width:200px;
    height:200px;
    top:5%;
    left:5%;
    animation-duration:20s;
}

.gear2{
    width:150px;
    height:150px;
    bottom:10%;
    right:8%;
    animation-duration:12s;
}

.gear3{
    width:100px;
    height:100px;
    top:60%;
    left:20%;
    animation-duration:8s;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* Main Box */
.container{
    width:350px;
    background:rgba(20,20,20,0.9);
    border:2px solid #444;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,255,170,0.2);
    position:relative;
    z-index:10;
}

h1{
    margin-bottom:10px;
    font-size:28px;
    color:#00ffaa;
    text-shadow:0 0 10px #00ffaa;
}

.timer{
    font-size:18px;
    margin-bottom:20px;
    color:#ff5555;
}

input{
    width:100%;
    padding:15px;
    font-size:25px;
    text-align:center;
    border:none;
    border-radius:10px;
    outline:none;
    margin-bottom:15px;
    background:#111;
    color:#00ffaa;
    letter-spacing:10px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:15px;
}

button{
    padding:15px;
    border:none;
    border-radius:10px;
    background:#1d1d1d;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#00ffaa;
    color:black;
}

.action{
    width:100%;
    margin-top:10px;
    background:#00ffaa;
    color:black;
    font-weight:bold;
}

.hints{
    margin-top:15px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.message{
    margin-top:15px;
    font-size:16px;
    min-height:20px;
}

.locked{
    color:red;
    font-weight:bold;
}

.factory-line{
    position:absolute;
    width:100%;
    height:5px;
    background:linear-gradient(to right, transparent, #00ffaa, transparent);
    bottom:0;
    animation:move 2s linear infinite;
}

@keyframes move{
    from{transform:translateX(-100%);}
    to{transform:translateX(100%);}
}
</style>
</head>

<body>

<div class="gear gear1"></div>
<div class="gear gear2"></div>
<div class="gear gear3"></div>

<div class="container">

    <h1>ACCESS PANEL</h1>
    
    <div class="timer">
        SYSTEM ACTIVE
    </div>

    <input type="password" id="display" maxlength="4" readonly>

    <div class="buttons">
        <button onclick="addNum('1')">1</button>
        <button onclick="addNum('2')">2</button>
        <button onclick="addNum('3')">3</button>
        <button onclick="addNum('4')">4</button>
        <button onclick="addNum('5')">5</button>
        <button onclick="addNum('6')">6</button>
        <button onclick="addNum('7')">7</button>
        <button onclick="addNum('8')">8</button>
        <button onclick="addNum('9')">9</button>
        <button onclick="clearInput()">C</button>
        <button onclick="addNum('0')">0</button>
        <button onclick="delNum()">⌫</button>
    </div>

    <button class="action" onclick="checkPin()">
        UNLOCK
    </button>

    <div class="hints">
        <button onclick="showHint(1)">Hint 1</button>
        <button onclick="showHint(2)">Hint 2</button>
        <button onclick="showHint(3)">Hint 3</button>
        <button onclick="showHint(4)">Hint 4</button>
    </div>

    <div class="message" id="message"></div>

    <div class="factory-line"></div>

</div>

<script>
const correctPin = "3739";
let attempts = 3;

function addNum(num){
    const display = document.getElementById("display");
    if(display.value.length < 4){
        display.value += num;
    }
}

function clearInput(){
    document.getElementById("display").value = "";
}

function delNum(){
    let display = document.getElementById("display");
    display.value = display.value.slice(0,-1);
}

function checkPin(){
    const display = document.getElementById("display");
    const message = document.getElementById("message");

    if(attempts <= 0){
        message.innerHTML = "SYSTEM LOCKED";
        message.classList.add("locked");
        return;
    }

    if(display.value === correctPin){
        message.style.color = "#00ffaa";
        message.innerHTML = "ACCESS GRANTED...";
        
        setTimeout(()=>{
            window.location.href = "https://poetic-praline-190a56.netlify.app";
        },1500);

    }else{
        attempts--;

        if(attempts > 0){
            message.style.color = "#ff5555";
            message.innerHTML = "PIN SALAH! SISA KESEMPATAN: " + attempts;
        }else{
            message.innerHTML = "SYSTEM LOCKED";
            message.classList.add("locked");
        }

        display.value = "";
    }
}

function showHint(num){
    const message = document.getElementById("message");

    if(num === 1){
        message.innerHTML = "Hint 1: Kelas Kita";
    }

    if(num === 2){
        message.innerHTML = "Hint 2: Absen Ilmi";
    }

    if(num === 3){
        message.innerHTML = "Hint 3: Berapa Kelas kita";
    }

    if(num === 4){
        message.innerHTML = "Hint 4: angka lain kelas kita";
    }
}
</script>

</body>
</html>
